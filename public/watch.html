<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — Pak-Anime</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
<script>
  (function () {
    var saved = localStorage.getItem('pakanime-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  })();
</script>
<style>
  .video-shell {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .video-shell video {
    width: 100%;
    display: block;
    max-height: 70vh;
  }
  #ad-container {
    position: absolute;
    inset: 0;
    display: none;
  }
  .download-progress {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .download-progress .bar {
    width: 90px;
    height: 5px;
    border-radius: 100px;
    background: var(--border);
    overflow: hidden;
  }
  .download-progress .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
  }
  .playlist {
    margin-top: 32px;
  }
  .playlist-title {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .episode-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    transition: border-color var(--transition), background var(--transition);
  }
  .episode-row:hover {
    border-color: var(--border-strong);
  }
  .episode-row.active {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .episode-number {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--text-muted);
    width: 28px;
    flex-shrink: 0;
  }
  .episode-row.active .episode-number {
    color: var(--accent);
  }
  .episode-title {
    font-size: 14px;
    flex: 1;
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/" class="brand"><span class="mark"></span>Pak-Anime</a>
    <div class="nav-links">
      <div data-nav-auth style="display:flex; align-items:center; gap:18px;"></div>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg data-icon-sun viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg data-icon-moon viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" style="display:none;"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button class="menu-toggle" data-menu-toggle aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-menu" data-mobile-menu>
    <div data-nav-auth-mobile style="display:flex; flex-direction:column; align-items:flex-start; gap:14px; width:100%;"></div>
  </div>
</nav>

<div class="container watch-shell" id="watch-shell">
  <div class="empty-state" id="watch-loading">Loading...</div>
</div>

<script src="/js/app.js"></script>
<script src="/js/downloads.js"></script>
<script src="/js/ads-config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const animeId = params.get('id');
  let currentUser = null;
  let currentAnime = null;

  async function loadTitle() {
    const shell = document.getElementById('watch-shell');
    if (!animeId) {
      shell.innerHTML = '<div class="empty-state"><h3>No title selected</h3><p><a href="/">Go back to the library</a></p></div>';
      return;
    }

    try {
      currentUser = (await api('/auth/me')).user;
    } catch (e) {
      currentUser = null;
    }

    try {
      currentAnime = await api(`/anime/${animeId}`);
    } catch (e) {
      shell.innerHTML = '<div class="empty-state"><h3>Title not found</h3><p><a href="/">Go back to the library</a></p></div>';
      return;
    }

    if (!currentUser) {
      shell.innerHTML = `
        <div class="empty-state">
          <h3>Log in to watch ${currentAnime.title}</h3>
          <p>Streaming and downloads are available to registered users.</p>
          <a href="/login.html" class="btn btn-primary" style="margin-top:12px;">Log in</a>
        </div>`;
      return;
    }

    const alreadyDownloaded = await getDownload(currentUser.username, currentAnime.id);

    shell.innerHTML = `
      <div class="video-shell">
        <video id="content-video" controls controlsList="nodownload" preload="metadata" src="/api/anime/${currentAnime.id}/stream"></video>
        <div id="ad-container"></div>
      </div>
      <div class="watch-meta">
        <div>
          <h1>${currentAnime.title}</h1>
          ${currentAnime.genre ? `<span class="tag">${currentAnime.genre}</span>` : ''}
          <p class="watch-desc">${currentAnime.description || 'No description yet.'}</p>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:10px;">
          <div style="display:flex; gap:8px;">
            <button class="btn btn-ghost" id="download-btn">
              ${alreadyDownloaded ? 'Downloaded — Open in My Downloads' : 'Download'}
            </button>
            ${currentUser.isAdmin ? '<button class="btn btn-danger" id="delete-btn">Delete title</button>' : ''}
          </div>
          <div class="download-progress" id="download-progress">
            <span id="download-progress-label">0%</span>
            <div class="bar"><div class="bar-fill" id="download-progress-fill"></div></div>
          </div>
        </div>
      </div>
      <div class="playlist" id="playlist-shell"></div>
    `;

    wireDownloadButton(!!alreadyDownloaded);
    if (currentUser.isAdmin) wireDeleteButton();
    setupPreRollAd();
    loadPlaylist();
  }

  async function loadPlaylist() {
    const shell = document.getElementById('playlist-shell');
    let data;
    try {
      data = await api(`/anime/${currentAnime.id}/playlist`);
    } catch (e) {
      return;
    }
    if (!data || !data.episodes || data.episodes.length < 2) return;

    shell.innerHTML = `
      <div class="playlist-title">${data.series.title} — ${data.episodes.length} episodes</div>
      ${data.episodes.map((ep) => `
        <a href="/watch.html?id=${ep.id}" class="episode-row ${ep.id === currentAnime.id ? 'active' : ''}">
          <span class="episode-number">${ep.episode_number ?? ''}</span>
          <span class="episode-title">${ep.title}</span>
        </a>
      `).join('')}
    `;
  }

  function wireDownloadButton(alreadyDownloaded) {
    const btn = document.getElementById('download-btn');
    if (alreadyDownloaded) {
      btn.addEventListener('click', () => { window.location.href = '/downloads.html'; });
      return;
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const progress = document.getElementById('download-progress');
      const fill = document.getElementById('download-progress-fill');
      const label = document.getElementById('download-progress-label');
      progress.style.display = 'flex';

      try {
        const blob = await fetchVideoWithProgress(`/api/anime/${currentAnime.id}/download`, (ratio) => {
          const pct = Math.round(ratio * 100);
          fill.style.width = `${pct}%`;
          label.textContent = `${pct}%`;
        });
        await saveDownload(currentUser.username, currentAnime, blob);
        progress.style.display = 'none';
        btn.disabled = false;
        btn.textContent = 'Downloaded — Open in My Downloads';
        btn.addEventListener('click', () => { window.location.href = '/downloads.html'; }, { once: true });
      } catch (e) {
        progress.style.display = 'none';
        btn.disabled = false;
        btn.textContent = 'Download failed — try again';
      }
    });
  }

  function wireDeleteButton() {
    document.getElementById('delete-btn').addEventListener('click', async () => {
      if (!confirm('Delete this title? This removes the video file too.')) return;
      await api(`/anime/${currentAnime.id}`, { method: 'DELETE' });
      window.location.href = '/';
    });
  }

  // --- Pre-roll ad (Google IMA SDK, works with any VAST-compliant network) ---
  function setupPreRollAd() {
    const adConfig = window.PAK_ANIME_ADS;
    const contentVideo = document.getElementById('content-video');
    if (!adConfig || !adConfig.ENABLED || typeof google === 'undefined') {
      return; // no ad configured, or SDK failed to load — just play content
    }

    const adContainerEl = document.getElementById('ad-container');

    google.ima.settings.setDisableCustomPlaybackForIOS10Plus(true);
    const adDisplayContainer = new google.ima.AdDisplayContainer(adContainerEl, contentVideo);
    const adsLoader = new google.ima.AdsLoader(adDisplayContainer);

    let adsManager;

    adsLoader.addEventListener(
      google.ima.AdErrorEvent.Type.AD_ERROR,
      () => {
        adContainerEl.style.display = 'none';
        contentVideo.play();
      },
      false
    );

    adsLoader.addEventListener(
      google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,
      (adsManagerLoadedEvent) => {
        adsManager = adsManagerLoadedEvent.getAdsManager(contentVideo);

        adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, () => {
          adContainerEl.style.display = 'none';
          contentVideo.play();
        });
        adsManager.addEventListener(google.ima.AdEvent.Type.CONTENT_PAUSE_REQUESTED, () => {
          contentVideo.pause();
        });
        adsManager.addEventListener(google.ima.AdEvent.Type.CONTENT_RESUME_REQUESTED, () => {
          adContainerEl.style.display = 'none';
          contentVideo.play();
        });
        adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, () => {
          adContainerEl.style.display = 'none';
          contentVideo.play();
        });

        try {
          adsManager.init(contentVideo.clientWidth, contentVideo.clientHeight, google.ima.ViewMode.NORMAL);
          adsManager.start();
        } catch (e) {
          adContainerEl.style.display = 'none';
          contentVideo.play();
        }
      },
      false
    );

    const adsRequest = new google.ima.AdsRequest();
    adsRequest.adTagUrl = adConfig.AD_TAG_URL;
    adsRequest.linearAdSlotWidth = contentVideo.clientWidth || 640;
    adsRequest.linearAdSlotHeight = contentVideo.clientHeight || 360;
    adsRequest.nonLinearAdSlotWidth = contentVideo.clientWidth || 640;
    adsRequest.nonLinearAdSlotHeight = 150;

    // The IMA SDK requires a user gesture to start playback on most
    // browsers, so ads are requested on first play rather than page load.
    contentVideo.addEventListener('play', function onFirstPlay() {
      contentVideo.removeEventListener('play', onFirstPlay);
      contentVideo.pause();
      adDisplayContainer.initialize();
      adContainerEl.style.display = 'block';
      try {
        adsLoader.requestAds(adsRequest);
      } catch (e) {
        adContainerEl.style.display = 'none';
        contentVideo.play();
      }
    }, { once: true });
  }

  loadTitle();
</script>
</body>
</html>
