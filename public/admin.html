<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload — Pak-Anime</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<script>
  (function () {
    var saved = localStorage.getItem('pakanime-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  })();
</script>
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/" class="brand"><span class="mark"></span>Pak-Anime</a>
    <div class="nav-links">
      <div data-nav-auth style="display:flex; align-items:center; gap:18px;"></div>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg data-icon-sun viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg data-icon-moon viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" style="display:none;"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button class="menu-toggle" data-menu-toggle aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-menu" data-mobile-menu>
    <div data-nav-auth-mobile style="display:flex; flex-direction:column; align-items:flex-start; gap:14px; width:100%;"></div>
  </div>
</nav>

<div class="container admin-shell" id="admin-shell">
  <div class="empty-state" id="admin-loading">Checking access...</div>
</div>

<script src="/js/app.js"></script>
<script>
  async function boot() {
    const shell = document.getElementById('admin-shell');
    let me;
    try {
      me = (await api('/auth/me')).user;
    } catch (e) {
      me = null;
    }

    if (!me || !me.isAdmin) {
      shell.innerHTML = '<div class="empty-state"><h3>Admins only</h3><p>Log in with an admin account to upload titles.</p></div>';
      return;
    }

    shell.innerHTML = `
      <div class="section-label">Upload a title</div>
      <div class="upload-card">
        <div class="form-error" id="form-error"></div>
        <form id="upload-form">
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" required>
          </div>
          <div class="field">
            <label for="genre">Genre</label>
            <input type="text" id="genre" placeholder="e.g. Shounen, Slice of Life">
          </div>
          <div class="field">
            <label for="description">Description</label>
            <textarea id="description"></textarea>
          </div>
          <div class="field">
            <label for="poster">Poster image</label>
            <input type="file" id="poster" accept="image/png,image/jpeg,image/webp">
          </div>
          <div class="field">
            <label for="video">Video file</label>
            <input type="file" id="video" accept="video/mp4,video/webm,video/quicktime,video/x-matroska" required>
          </div>
          <div class="progress-track" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <button type="submit" class="btn btn-primary btn-block" id="submit-btn" style="margin-top:8px;">Upload</button>
        </form>
      </div>

      <div class="admin-list">
        <div class="section-label">Uploaded titles</div>
        <div id="admin-list-items"></div>
      </div>
    `;

    wireUploadForm();
    loadAdminList();
  }

  function wireUploadForm() {
    document.getElementById('upload-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('form-error');
      errorBox.classList.remove('visible');

      const fd = new FormData();
      fd.append('title', document.getElementById('title').value.trim());
      fd.append('genre', document.getElementById('genre').value.trim());
      fd.append('description', document.getElementById('description').value.trim());

      const posterFile = document.getElementById('poster').files[0];
      const videoFile = document.getElementById('video').files[0];
      if (posterFile) fd.append('poster', posterFile);
      if (!videoFile) {
        errorBox.textContent = 'Choose a video file to upload.';
        errorBox.classList.add('visible');
        return;
      }
      fd.append('video', videoFile);

      const track = document.getElementById('progress-track');
      const fill = document.getElementById('progress-fill');
      const submitBtn = document.getElementById('submit-btn');
      track.classList.add('visible');
      submitBtn.disabled = true;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/anime');
      xhr.upload.addEventListener('progress', (ev) => {
        if (ev.lengthComputable) {
          fill.style.width = `${Math.round((ev.loaded / ev.total) * 100)}%`;
        }
      });
      xhr.onload = () => {
        submitBtn.disabled = false;
        if (xhr.status >= 200 && xhr.status < 300) {
          document.getElementById('upload-form').reset();
          fill.style.width = '0%';
          track.classList.remove('visible');
          loadAdminList();
        } else {
          errorBox.textContent = 'Upload failed. Check the file types and try again.';
          errorBox.classList.add('visible');
        }
      };
      xhr.onerror = () => {
        submitBtn.disabled = false;
        errorBox.textContent = 'Upload failed. Check your connection and try again.';
        errorBox.classList.add('visible');
      };
      xhr.send(fd);
    });
  }

  async function loadAdminList() {
    const list = document.getElementById('admin-list-items');
    try {
      const items = await api('/anime');
      if (!items.length) {
        list.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">Nothing uploaded yet.</p>';
        return;
      }
      list.innerHTML = items.map((item) => `
        <div class="admin-row">
          <div>
            <div class="row-title">${item.title}</div>
            <div class="row-meta">${item.genre || 'Anime'}</div>
          </div>
          <button class="btn btn-danger" data-delete="${item.id}" style="padding:6px 12px; font-size:13px;">Delete</button>
        </div>
      `).join('');

      list.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this title? This removes the video file too.')) return;
          await api(`/anime/${btn.dataset.delete}`, { method: 'DELETE' });
          loadAdminList();
        });
      });
    } catch (e) {
      list.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">Could not load titles.</p>';
    }
  }

  boot();
</script>
</body>
</html>
