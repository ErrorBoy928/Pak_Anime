<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Pak-Anime</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<script>
  (function () {
    var saved = localStorage.getItem('pakanime-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  })();
</script>
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/" class="brand"><span class="mark"></span>Pak-Anime</a>
    <div class="nav-links">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg data-icon-sun viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg data-icon-moon viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" style="display:none;"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="auth-shell">
    <h1>Create your account</h1>
    <div class="sub">Free — stream and download anything in the library.</div>
    <div class="form-error" id="form-error"></div>
    <form id="register-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" autocomplete="username">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('form-error');
    errorBox.classList.remove('visible');

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const messages = {
      already_exists: 'That username or email is already taken.',
      invalid_username: 'Username must be 3-20 characters (letters, numbers, underscore).',
      invalid_email: 'Enter a valid email address.',
      weak_password: 'Password must be at least 8 characters.',
    };

    try {
      await api('/auth/register', { method: 'POST', body: JSON.stringify({ username, email, password }) });
      window.location.href = '/';
    } catch (err) {
      errorBox.textContent = messages[err.body?.error] || 'Something went wrong. Try again.';
      errorBox.classList.add('visible');
    }
  });
</script>
</body>
</html>
