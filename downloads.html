<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Downloads — Pak-Anime</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<script>
  (function () {
    var saved = localStorage.getItem('pakanime-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  })();
</script>
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/" class="brand"><span class="mark"></span>Pak-Anime</a>
    <div class="nav-links">
      <div data-nav-auth style="display:flex; align-items:center; gap:18px;"></div>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg data-icon-sun viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg data-icon-moon viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" style="display:none;"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button class="menu-toggle" data-menu-toggle aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-menu" data-mobile-menu>
    <div data-nav-auth-mobile style="display:flex; flex-direction:column; align-items:flex-start; gap:14px; width:100%;"></div>
  </div>
</nav>

<main class="container" style="padding: 32px 0 60px;">
  <div class="section-label">My Downloads</div>
  <div id="downloads-shell">
    <div class="empty-state" id="downloads-loading">Loading...</div>
  </div>
</main>

<!-- Inline offline player, hidden until a download is opened -->
<div id="player-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:100; align-items:center; justify-content:center; padding:20px;">
  <div style="width:100%; max-width:900px;">
    <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
      <button class="btn btn-ghost" id="close-player">Close</button>
    </div>
    <video id="offline-video" controls style="width:100%; max-height:75vh; border-radius:12px; background:#000;"></video>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/downloads.js"></script>
<script>
  function posterMarkup(item) {
    if (item.posterPath) {
      return `<img src="${item.posterPath}" alt="${item.title} poster" loading="lazy">`;
    }
    return `<span>${item.title.slice(0, 2).toUpperCase()}</span>`;
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    const mb = bytes / (1024 * 1024);
    return mb > 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${mb.toFixed(0)} MB`;
  }

  async function render() {
    const shell = document.getElementById('downloads-shell');
    let me;
    try {
      me = (await api('/auth/me')).user;
    } catch (e) {
      me = null;
    }

    if (!me) {
      shell.innerHTML = `
        <div class="empty-state">
          <h3>Log in to see your downloads</h3>
          <a href="/login.html" class="btn btn-primary" style="margin-top:12px;">Log in</a>
        </div>`;
      return;
    }

    const items = await listDownloads(me.username);
    if (!items.length) {
      shell.innerHTML = `
        <div class="empty-state">
          <h3>No downloads yet</h3>
          <p>Downloaded titles stay on this device, ready to watch without internet.</p>
          <a href="/" class="btn btn-primary" style="margin-top:12px;">Browse the library</a>
        </div>`;
      return;
    }

    shell.innerHTML = `<div class="grid">${items.map((item) => `
      <div class="card">
        <div class="card-poster">${posterMarkup(item)}</div>
        <div class="card-body">
          <div class="card-title">${item.title}</div>
          <div class="card-genre">${item.genre || 'Anime'} · ${formatSize(item.size)}</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn btn-primary" data-play="${item.animeId}" style="flex:1; padding:8px;">Play</button>
            <button class="btn btn-danger" data-remove="${item.animeId}" style="padding:8px 12px;">Remove</button>
          </div>
        </div>
      </div>
    `).join('')}</div>`;

    shell.querySelectorAll('[data-play]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const item = await getDownload(me.username, btn.dataset.play);
        if (!item) return;
        const video = document.getElementById('offline-video');
        video.src = URL.createObjectURL(item.blob);
        document.getElementById('player-overlay').style.display = 'flex';
        video.play();
      });
    });

    shell.querySelectorAll('[data-remove]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remove this download from your device?')) return;
        await removeDownload(me.username, btn.dataset.remove);
        render();
      });
    });
  }

  document.getElementById('close-player').addEventListener('click', () => {
    const video = document.getElementById('offline-video');
    video.pause();
    video.removeAttribute('src');
    video.load();
    document.getElementById('player-overlay').style.display = 'none';
  });

  render();
</script>
</body>
</html>
